name: measure vantage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: install proxyUtil
        run: pip install "proxyUtil @ git+https://github.com/mheidari98/proxyUtil@modernize"
      - name: measure TCP reachability from the runner
        run: |
          ulimit -n 4096
          python tools/measure_vantage.py all vantage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vantage
          path: vantage.json
